<head>

<link rel="stylesheet" href="shared.css" />
<style>
.bg-glow {
  position: fixed; top: -10%; left: 50%; transform: translateX(-50%);
  width: 90vw; height: 60vh;
  background: radial-gradient(ellipse, rgba(100,0,200,0.15) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
  animation: pulse 6s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
  50%      { opacity: 1; transform: translateX(-50%) scale(1.1); }
}
main {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: clamp(50px,8vw,90px) clamp(20px,5vw,40px) clamp(30px,5vw,60px);
}
#avatar-wrap {
  width: clamp(90px,14vw,120px); height: clamp(90px,14vw,120px);
  position: relative; perspective: 600px; margin-bottom: 20px;
}
#avatar-inner {
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.15s ease-out; will-change: transform;
  animation: float 4s ease-in-out infinite;
}
#avatar-inner.tilting { animation: none; }
@keyframes float {
  0%,100% { transform: translateY(0) rotateX(2deg); }
  50%      { transform: translateY(-8px) rotateX(-2deg); }
}
.avatar-circle {
  width: 100%; height: 100%; border-radius: 50%;
  background: linear-gradient(135deg, #6600CC, #9B59B6);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(2rem,4vw,2.6rem); font-weight: 900; color: white;
  letter-spacing: -0.02em;
  box-shadow: 0 0 0 3px rgba(155,89,182,0.3), 0 20px 50px rgba(102,0,204,0.4);
}
.profile-name {
  font-size: clamp(1.5rem,4.5vw,2.4rem);
  font-weight: 900; text-transform: uppercase;
  letter-spacing: -0.02em; text-align: center; margin-bottom: 6px;
}
.profile-title {
  color: #9B59B6; font-size: clamp(0.7rem,1.3vw,0.92rem);
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.15em;
  text-align: center; margin-bottom: 4px;
}
.profile-sub {
  color: #555; font-size: clamp(0.65rem,1.1vw,0.8rem);
  text-align: center; font-weight: 300; margin-bottom: clamp(28px,5vw,44px);
}
.links-wrap { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 12px; }
.link-btn {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  width: 100%; height: 56px; border-radius: 9999px;
  font-family: 'Kanit', sans-serif; font-weight: 600;
  font-size: clamp(0.8rem,1.4vw,0.95rem);
  text-transform: uppercase; letter-spacing: 0.1em;
  text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; border: none;
}
.link-btn:hover { transform: scale(1.03); }
.link-icon { font-size: 1.2em; }
.btn-instagram { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); color: white; }
.btn-instagram:hover { box-shadow: 0 12px 32px rgba(253,29,29,0.35); }
.btn-linkedin { background: #0077b5; color: white; }
.btn-linkedin:hover { box-shadow: 0 12px 32px rgba(0,119,181,0.4); }
.btn-gmail { background: #EA4335; color: white; }
.btn-gmail:hover { box-shadow: 0 12px 32px rgba(234,67,53,0.4); }
.btn-whatsapp { background: #25D366; color: #0A0A0A; }
.btn-whatsapp:hover { box-shadow: 0 12px 32px rgba(37,211,102,0.4); }
.btn-resume {
  background: linear-gradient(123deg, #0D001A 7%, #6600CC 37%, #4400AA 72%, #220066 100%);
  box-shadow: 0px 4px 20px rgba(100,0,200,0.35), inset 4px 4px 12px #6600CC;
  outline: 2px solid rgba(255,255,255,0.8); outline-offset: -3px; color: white;
}
.btn-resume:hover { box-shadow: 0 12px 36px rgba(120,0,255,0.5); }
.btn-call { background: transparent; border: 2px solid rgba(155,89,182,0.5); color: #9B59B6; }
.btn-call:hover { background: rgba(102,0,204,0.1); box-shadow: 0 8px 24px rgba(102,0,204,0.2); }
.nav-pills {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  margin-top: clamp(36px,6vw,56px); max-width: 460px;
}
.nav-pill {
  color: #666; font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.1em; text-decoration: none; font-weight: 500;
  border: 1px solid rgba(255,255,255,0.08); padding: 7px 16px; border-radius: 9999px;
  transition: color 0.2s, border-color 0.2s;
}
.nav-pill:hover { color: #9B59B6; border-color: rgba(155,89,182,0.4); }
</style>
